name = "adams-library"
main = "dist/server/index.js"
compatibility_date = "2026-09-26"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "adams-library"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "adams-library-books"

[vars]
# Set GEMINI_API_KEY as a Worker secret; never commit it here.
# GEMINI_TEXT_MODEL = "gemini-3.7-flash"
# GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
# Set GEMINI_TTS_API_KEY and/or GOOGLE_CLOUD_TTS_API_KEY as Worker secrets.
